<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>한동맛집 지도 - 일식</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="map-page">
    <div class="map-container">
      <div class="pin-wrapper" style="left: 59%; top: 85%">
        <div class="pin japanese-pin"></div>
        <div class="popup">
          <img src="카츠닉.png" alt="카츠닉" usemap="#카츠닉" />
          <map name="카츠닉">
            <area
              shape="rect"
              coords="55,54,315,90"
              href="https://search.naver.com/search.naver?sm=tab_hty.top&where=nexearch&ssc=tab.nx.all&query=%EC%B9%B4%EC%B8%A0%EB%8B%89&oquery=%EC%9D%B8%EB%B8%8C%EB%A6%AC%EC%A6%88&tqi=jmm4lwqXKZwssB5kkzo-022146&ackey=xhx3cfkz"
              target="_blank"
            />
          </map>
        </div>
      </div>
      <div class="pin-wrapper" style="left: 55%; top: 50%">
        <div class="pin japanese-pin"></div>
        <div class="popup">
          <img src="타마시텐.png" alt="타마시텐" usemap="#타마시텐" />
          <map name="타마시텐">
            <area
              shape="rect"
              coords="55,54,315,90"
              href="https://search.naver.com/search.naver?sm=tab_hty.top&where=nexearch&ssc=tab.nx.all&query=%ED%83%80%EB%A7%88%EC%8B%9C%ED%85%90&oquery=%EC%B9%B4%EC%B8%A0%EB%8B%89&tqi=jmm5vwqpsp6z1tgOsC4-356393&ackey=p42cnutg"
              target="_blank"
            />
          </map>
        </div>
      </div>
    </div>

    <div class="menu-container">
      <a href="korean.html">
        <img src="k.png" class="menu-img" alt="한식" />
      </a>

      <a href="western.html">
        <img src="w.png" class="menu-img" alt="양식" />
      </a>

      <a href="chinese.html">
        <img src="c.png" class="menu-img" alt="중식" />
      </a>

      <a href="japanese.html">
        <img src="j.png" class="menu-img" alt="일식" />
      </a>

      <a href="cafe.html">
        <img src="f.png" class="menu-img" alt="카페" />
      </a>
    </div>

    <map name="">
      <area
        shape="rect"
        coords=""
        alt="카츠닉"
        href="https://search.naver.com/search.naver?sm=tab_hty.top&where=nexearch&ssc=tab.nx.all&query=%EC%B9%B4%EC%B8%A0%EB%8B%89&oquery=%EC%9D%B8%EB%B8%8C%EB%A6%AC%EC%A6%88&tqi=jmm4lwqXKZwssB5kkzo-022146&ackey=xhx3cfkz"
      />
      <area
        shape="rect"
        coords=""
        alt="타마시텐"
        href="https://search.naver.com/search.naver?sm=tab_hty.top&where=nexearch&ssc=tab.nx.all&query=%ED%83%80%EB%A7%88%EC%8B%9C%ED%85%90&oquery=%EC%B9%B4%EC%B8%A0%EB%8B%89&tqi=jmm5vwqpsp6z1tgOsC4-356393&ackey=p42cnutg"
      />
    </map>
    <script>
      const pins = document.querySelectorAll(".pin");

      pins.forEach((pin) => {
        pin.addEventListener("click", function (event) {
          const currentPopup = this.parentElement.querySelector(".popup");

          // 다른 팝업 닫기
          document.querySelectorAll(".popup").forEach((popup) => {
            if (popup !== currentPopup) {
              popup.classList.remove("show");
            }
          });

          // 현재 팝업 열기/닫기
          currentPopup.classList.toggle("show");

          event.stopPropagation();
        });
      });

      // 빈 곳 클릭 시 모든 팝업 닫기
      document.addEventListener("click", function () {
        document.querySelectorAll(".popup").forEach((popup) => {
          popup.classList.remove("show");
        });
      });

      // 팝업 내부 클릭 시 닫히지 않게
      document.querySelectorAll(".popup").forEach((popup) => {
        popup.addEventListener("click", function (event) {
          event.stopPropagation();
        });
      });
    </script>
  </body>
</html>
