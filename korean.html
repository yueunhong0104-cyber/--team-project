<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>한동맛집 지도 - 한식</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="map-page">
    <div class="map-container">
      <div class="pin-wrapper" style="left: 40%; top: 60%">
        <div class="pin korean-pin"></div>
        <div class="popup">
          <img src="대원도토리수제비.png" alt="식당1" usemap="#대원" />
          <map name="대원">
            <area
              shape="rect"
              coords="55,54,315,90"
              href="https://map.naver.com/p/search/%EB%8C%80%EC%9B%90%EB%8F%84%ED%86%A0%EB%A6%AC%EC%88%98%EC%A0%9C%EB%B9%84/place/21053181?placePath=/home?bk_query=%EB%8C%80%EC%9B%90%EB%8F%84%ED%86%A0%EB%A6%AC%EC%88%98%EC%A0%9C%EB%B9%84&entry=pll&from=nx&fromNxList=true&from=map&fromPanelNum=2&timestamp=202606070243&locale=ko&svcName=map_pcv5&searchText=%EB%8C%80%EC%9B%90%EB%8F%84%ED%86%A0%EB%A6%AC%EC%88%98%EC%A0%9C%EB%B9%84&entry=pll&from=nx&fromNxList=true&searchType=place"
              target="_blank"
            />
          </map>
        </div>
      </div>
      <div class="pin-wrapper" style="left: 24%; top: 47%">
        <div class="pin korean-pin"></div>
        <div class="popup">
          <img src="바벤.png" alt="식당2" usemap="#바벤" />
          <map name="바벤">
            <area
              shape="rect"
              coords="55,54,315,90"
              href="https://map.naver.com/p/search/%EB%B0%94%EB%B2%A4/place/1880628993?placePath=/home?bk_query=%EB%B0%94%EB%B2%A4&entry=pll&from=nx&fromNxList=true&fromPanelNum=2&timestamp=202605282221&locale=ko&svcName=map_pcv5&searchText=%EB%B0%94%EB%B2%A4&searchType=place&c=15.00,0,0,0,dh"
              target="_blank"
            />
          </map>
        </div>
      </div>
      <div class="pin-wrapper" style="left: 18%; top: 80%">
        <div class="pin korean-pin"></div>
        <div class="popup">
          <img
            src="포항홍게무한리필.png"
            alt="식당3"
            usemap="#포항홍게무한리필"
          />
          <map name="포항홍게무한리필">
            <area
              shape="rect"
              coords="55,54,315,90"
              href="https://map.naver.com/p/search/%ED%8F%AC%ED%95%AD%ED%99%8D%EA%B2%8C%EB%AC%B4%ED%95%9C%EB%A6%AC%ED%95%84/place/32131726?placePath=/home?bk_query=%ED%8F%AC%ED%95%AD%ED%99%8D%EA%B2%8C%EB%AC%B4%ED%95%9C%EB%A6%AC%ED%95%84&entry=pll&from=nx&fromNxList=true&from=map&fromPanelNum=2&timestamp=202606041719&locale=ko&svcName=map_pcv5&searchText=%ED%8F%AC%ED%95%AD%ED%99%8D%EA%B2%8C%EB%AC%B4%ED%95%9C%EB%A6%AC%ED%95%84&entry=pll&from=nx&fromNxList=true&searchType=place"
              target="blank"
            />
          </map>
        </div>
      </div>
    </div>

    <div class="menu-container">
      <a href="korean.html">
        <img src="k.png" class="menu-img" alt="한식" />
      </a>

      <a href="western.html">
        <img src="w.png" class="menu-img" alt="양식" />
      </a>

      <a href="chinese.html">
        <img src="c.png" class="menu-img" alt="중식" />
      </a>

      <a href="japanese.html">
        <img src="j.png" class="menu-img" alt="일식" />
      </a>

      <a href="cafe.html">
        <img src="f.png" class="menu-img" alt="카페" />
      </a>
    </div>

    <script>
      const pins = document.querySelectorAll(".pin");

      pins.forEach((pin) => {
        pin.addEventListener("click", function (event) {
          const currentPopup = this.parentElement.querySelector(".popup");

          // 다른 팝업 닫기
          document.querySelectorAll(".popup").forEach((popup) => {
            if (popup !== currentPopup) {
              popup.classList.remove("show");
            }
          });

          // 현재 팝업 열기/닫기
          currentPopup.classList.toggle("show");

          event.stopPropagation();
        });
      });

      // 빈 곳 클릭 시 모든 팝업 닫기
      document.addEventListener("click", function () {
        document.querySelectorAll(".popup").forEach((popup) => {
          popup.classList.remove("show");
        });
      });

      // 팝업 내부 클릭 시 닫히지 않게
      document.querySelectorAll(".popup").forEach((popup) => {
        popup.addEventListener("click", function (event) {
          event.stopPropagation();
        });
      });
    </script>
  </body>
</html>
