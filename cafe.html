  <body class="map-page">

          <img src="로드샵 카페.png" alt="로드샵카페" usemap="#로드샵카페" />
          <map name="로드샵카페">
            <area
              shape="rect"
              coords="55,54,315,90"
              href="https://map.naver.com/p/search/%EB%A1%9C%EB%93%9C%EC%83%B5%EC%B9%B4%ED%8E%98/place/1880968360?placePath=/home?bk_query=%EB%A1%9C%EB%93%9C%EC%83%B5%EC%B9%B4%ED%8E%98&entry=pll&from=nx&fromNxList=true&from=map&fromPanelNum=2&timestamp=202606070351&locale=ko&svcName=map_pcv5&searchText=%EB%A1%9C%EB%93%9C%EC%83%B5%EC%B9%B4%ED%8E%98&placeSearchOption=bk_query%3D%25EB%25A1%259C%25EB%2593%259C%25EC%2583%25B5%25EC%25B9%25B4%25ED%258E%2598%26entry%3Dpll%26fromNxList%3Dtrue%26originalQuery%3D%25EB%25A1%259C%25EB%2593%259C%25EC%2583%25B5%25EC%25B9%25B4%25ED%258E%2598%26x%3D129.350350%26y%3D36.025292&searchType=place"
              target="_blank"
            />
          </map>
        </div>
      </div>
      <div class="pin-wrapper" style="left: 45%; top: 39%">
        <div class="pin cafe-pin"></div>
        <div class="popup">
          <img src="오픈오프.png" alt="오픈오프" usemap="#오픈오프" />
          <map name="오픈오프">
            <area
              shape="rect"
              coords="55,54,315,90"
              href="https://search.naver.com/search.naver?sm=tab_hty.top&where=nexearch&ssc=tab.nx.all&query=%EC%98%A4%ED%94%88%EC%98%A4%ED%94%84&oquery=%EC%98%A4%ED%94%88%EC%98%A4%ED%94%88&tqi=jAexIlqos5wssNkfKIV-074172&ackey=xnewnyrj"
              target="_blank"
            />
          </map>
        </div>
      </div>
      <div class="pin-wrapper" style="left: 42%; top: 87%">
        <div class="pin cafe-pin"></div>
        <div class="popup">
          <img src="오후애.png" alt="오후애" usemap="#오후애" />
          <map name="오후애">
            <area
              shape="rect"
              coords="55,54,315,90"
              href="https://map.naver.com/p/search/%EC%98%A4%ED%9B%84%EC%95%A0/place/1047091227?placePath=/home?bk_query=%EC%98%A4%ED%9B%84%EC%95%A0&entry=pll&from=nx&fromNxList=true&from=map&fromPanelNum=2&timestamp=202606011505&locale=ko&svcName=map_pcv5&searchText=%EC%98%A4%ED%9B%84%EC%95%A0&placeSearchOption=bk_query%"

    <div class="menu-container">
      <a href="korean.html">
        <img src="k.png" class="menu-img" alt="한식" />

      <a href="western.html">
        <img src="w.png" class="menu-img" alt="양식" />

      </a>

      <a href="cafe.html">
        <img src="f.png" class="menu-img" alt="카페" />
      </a>
    </div>

    <script>
      const pins = document.querySelectorAll(".pin");

      pins.forEach((pin) => {
        pin.addEventListener("click", function (event) {
          const currentPopup = this.parentElement.querySelector(".popup");

          // 다른 팝업 닫기
          document.querySelectorAll(".popup").forEach((popup) => {
            if (popup !== currentPopup) {
              popup.classList.remove("show");
            }
          });

          // 현재 팝업 열기/닫기
          currentPopup.classList.toggle("show");

          event.stopPropagation();
        });
      });

      // 빈 곳 클릭 시 모든 팝업 닫기
      document.addEventListener("click", function () {
        document.querySelectorAll(".popup").forEach((popup) => {
          popup.classList.remove("show");
        });
      });

      // 팝업 내부 클릭 시 닫히지 않게
      document.querySelectorAll(".popup").forEach((popup) => {
        popup.addEventListener("click", function (event) {
          event.stopPropagation();
        });
      });
    </script>
  </body>
</html>
